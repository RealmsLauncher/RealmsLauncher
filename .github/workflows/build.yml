name: Build & Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Release
      create-release:
        description: Create a GitHub Release with the artifacts?
        type: boolean
        default: true
      pre-release:
        description: Mark as pre-release?
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux ----
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.10.2

          # ---- Windows (x64) ----
          - os: windows-2022
            artifact-name: Windows-GNU          # MinGW (x64)
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86

          - os: windows-2022
            artifact-name: Windows              # MSVC (x64, default)
            cmake-preset: windows_msvc
            vcvars-arch: amd64
            qt-version: 6.10.2

          # ---- Windows (ARM64) ----
          - os: windows-11-arm
            artifact-name: Windows-ARM-GNU      # MinGW ARM64
            cmake-preset: windows_mingw
            msystem: CLANGARM64
            vcvars-arch: arm64

          - os: windows-11-arm
            artifact-name: Windows-ARM          # MSVC ARM64
            cmake-preset: windows_msvc
            vcvars-arch: arm64
            qt-version: 6.10.2

          # ---- macOS ----
          - os: macos-15
            artifact-name: macOS-AppleSilicon
            cmake-preset: macos_arm64
            macosx-deployment-target: 12.0
            qt-version: 6.9.3

          - os: macos-12
            artifact-name: macOS-Intel
            cmake-preset: macos_x86_64
            macosx-deployment-target: 12.0
            qt-version: 6.9.3

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure project
        run: cmake --preset "$CMAKE_PRESET"

      - name: Run build
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Run tests
        run: ctest --preset "$CMAKE_PRESET" --build-config "$BUILD_TYPE"

      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ always() && inputs.create-release == true }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download successful artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: false

      - name: Show available artifacts
        shell: bash
        run: |
          echo "Artifacts that successfully built:"
          if [ -d artifacts ]; then
            find artifacts -type f -print || echo "No artifacts were produced."
          else
            echo "No artifacts were produced."
          fi

      - name: Create release tag (if missing)
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists, skipping creation."
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.version.outputs.version }}"
          BODY="## Realms Launcher $TAG

          This release was automatically built from commit ${{ github.sha }}.

          **Build type:** ${{ inputs.build-type || 'Release' }}

          ### 📦 Downloads
          Download the appropriate package for your platform below.

          > Some platforms may be unavailable if their build failed in CI.

          ---
          *Built with ❤️ by the Realms Launcher team.*"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --title "Release" \
              --notes "$BODY" \
              --draft=false \
              --prerelease=${{ inputs.pre-release == true && 'true' || 'false' }}
          else
            echo "Release $TAG already exists."
          fi

      - name: Upload successful release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.version.outputs.version }}"
          if [ ! -d artifacts ]; then
            echo "No successful build artifacts to upload."
            exit 0
          fi
          find artifacts -type f -print
          while IFS= read -r -d '' file; do
            echo "Uploading $file..."
            gh release upload "$TAG" "$file" --clobber
            sleep 2
          done < <(find artifacts -type f -print0)
